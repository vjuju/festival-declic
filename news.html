<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>News — Festival Déclic</title>
    <meta name="theme-color" content="#3DA9E0">
    <link rel="preload" href="/assets/illu-cover.jpg" as="image">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #3DA9E0 url('/assets/illu-cover.jpg') center / cover no-repeat fixed;
        }

        .back {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top));
            left: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #111;
            text-decoration: none;
        }

        .back svg { width: 26px; height: 26px; display: block; }

        /* --- Embed plein écran : 10px gauche/bas/droite, dégagement en haut pour le chevron --- */
        #frame-wrap {
            position: fixed;
            top: calc(52px + env(safe-area-inset-top));
            right: 10px;
            bottom: 10px;
            left: 10px;
            border-radius: 18px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        #frame-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <a class="back" href="/" aria-label="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>

    <div id="frame-wrap">
        <iframe src="https://onestpret.notion.site/ebd/38786e57ca1b802ca37cf920031a26fd"
                allowfullscreen title="News — Festival Déclic"></iframe>
    </div>
</body>
</html>

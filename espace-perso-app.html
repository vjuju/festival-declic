<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace perso — Festival Déclic</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2d2d2d;
        }

        body {
            box-sizing: border-box;
            padding: 12px;
        }

        /* État « connecté » : barre d'outils + embed */
        #embed {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        #embed iframe {
            display: block;
            width: 100%;
            flex: 1;
            border: 0;
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0 0 12px;
            flex-wrap: wrap;
        }

        #upload-btn {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            background: #5ECBA1;
            color: #07130d;
            border: 0;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        #upload-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(94, 203, 161, 0.4);
        }

        #upload-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #upload-status {
            font-size: 0.9rem;
            color: #555;
        }

        /* État « pas encore d'espace » : message + liens vers les formulaires */
        #message {
            display: none;
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            text-align: center;
        }

        #message h1 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 1.5rem;
        }

        #message .highlight {
            background: #f8f9fa;
            border-left: 4px solid #f5c542;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            text-align: left;
        }

        #message .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        #message .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            background: #f5c542;
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #message .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 197, 66, 0.4);
        }
    </style>
</head>
<body>
    <div id="embed">
        <div id="toolbar">
            <button type="button" id="upload-btn">Ajouter une photo</button>
            <span id="upload-status"></span>
            <input type="file" id="file-input" accept="image/*" hidden>
        </div>
        <iframe id="espace-frame" allowfullscreen title="Espace perso — Festival Déclic"></iframe>
    </div>

    <div id="message">
        <h1>Espace perso</h1>
        <div class="highlight">
            <p style="margin:0;">
                Si tu as déjà rempli le formulaire, retrouve le mail
                <strong>« Ton espace perso »</strong> et clique sur le lien qu'il contient.
            </p>
        </div>
        <p style="margin-top:2rem;">Sinon, remplis le formulaire&nbsp;:</p>
        <div class="actions">
            <a class="btn" href="/formulaire/intervenant-e/">Intervenant·e</a>
            <a class="btn" href="/formulaire/participant-e/">Participant·e</a>
        </div>
    </div>

    <script>
        // Espace Notion publié du festival : chaque personne a sa propre page Notion,
        // identifiée par le slug présent dans l'URL /espace-perso/<slug>.
        // Ex. /espace-perso/Ju-test-YALLAH-37586e57ca1b81e2a75defff5550d222
        //
        // IMPORTANT : Notion n'autorise l'iframe QUE via son endpoint /ebd/<pageId>
        // (frame-ancestors https:). L'URL de page publiée (notion.site/<slug>) renvoie
        // x-frame-options: SAMEORIGIN et refuse l'embed. On embarque donc /ebd/<pageId>,
        // où pageId = les 32 caractères hexadécimaux à la fin du slug.
        var NOTION_EMBED_BASE = "https://onestpret.notion.site/ebd/";

        function notionEmbedUrl(slug) {
            var match = String(slug).match(/[0-9a-f]{32}$/i);
            var pageId = match ? match[0] : slug;
            return NOTION_EMBED_BASE + pageId;
        }

        // Slug = segment après /espace-perso/ ; sinon on reprend celui mémorisé.
        var segments = window.location.pathname.split("/").filter(Boolean); // ex. ["espace-perso", "Ju-..."]
        var slug = (segments[0] === "espace-perso" && segments[1]) ? segments[1] : "";

        if (slug) {
            // Premier accès via le lien du mail : on mémorise l'espace de la personne.
            try { localStorage.setItem("declicEspaceSlug", slug); } catch (e) {}
        } else {
            try { slug = localStorage.getItem("declicEspaceSlug") || ""; } catch (e) {}
        }

        function pageIdFromSlug(slug) {
            var match = String(slug).match(/[0-9a-f]{32}$/i);
            return match ? match[0] : "";
        }

        if (slug) {
            var frame = document.getElementById("espace-frame");
            frame.src = notionEmbedUrl(slug);
            document.getElementById("embed").style.display = "flex";

            // --- Upload d'une photo vers la fiche Notion via /api/upload ---
            var pageId = pageIdFromSlug(slug);
            var btn = document.getElementById("upload-btn");
            var input = document.getElementById("file-input");
            var status = document.getElementById("upload-status");

            btn.addEventListener("click", function () { input.click(); });

            input.addEventListener("change", async function () {
                var file = input.files && input.files[0];
                if (!file) return;
                if (file.size > 20 * 1024 * 1024) {
                    status.textContent = "Fichier trop volumineux (max 20 Mo).";
                    input.value = "";
                    return;
                }

                btn.disabled = true;
                status.textContent = "Envoi en cours…";

                try {
                    var fd = new FormData();
                    fd.append("file", file, file.name);
                    fd.append("pageId", pageId);

                    var res = await fetch("/api/upload", { method: "POST", body: fd });
                    var data = await res.json().catch(function () { return {}; });

                    if (res.ok && data.ok) {
                        status.textContent = "Photo ajoutée ✓";
                        // Recharge l'embed pour afficher la photo.
                        frame.src = notionEmbedUrl(slug);
                    } else {
                        status.textContent = "Échec : " + (data.error || ("erreur " + res.status));
                    }
                } catch (e) {
                    status.textContent = "Échec de l'envoi (réseau).";
                } finally {
                    btn.disabled = false;
                    input.value = "";
                }
            });
        } else {
            document.getElementById("message").style.display = "block";
        }
    </script>
</body>
</html>

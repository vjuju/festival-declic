<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace perso — Festival Déclic</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            box-sizing: border-box;
            padding: 12px;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <iframe id="profil-frame" allowfullscreen title="Espace perso — Festival Déclic"></iframe>

    <script>
        // Espace Notion publié du festival : chaque profil = une page Notion dont
        // l'identifiant est le profil-ID. L'embed pointe vers la page de la personne.
        var NOTION_BASE = "https://onestpret.notion.site/";

        // L'ID de profil est le dernier segment de l'URL : /profil/<profil-ID>
        // (avec repli sur ?id=<profil-ID> au cas où).
        var segments = window.location.pathname.split("/").filter(Boolean); // ex. ["profil", "abc123"]
        var profilId = (segments[0] === "profil" && segments[1]) ? segments[1] : "";
        if (!profilId) {
            profilId = new URLSearchParams(window.location.search).get("id") || "";
        }

        if (profilId) {
            // On mémorise le profil pour les prochaines visites (onglet « Espace perso »).
            try { localStorage.setItem("declicProfilId", profilId); } catch (e) {}
            document.getElementById("profil-frame").src = NOTION_BASE + encodeURIComponent(profilId);
        } else {
            // Pas d'ID : on renvoie vers la page Espace perso classique.
            window.location.replace("/espace-perso/");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Devenir intervenant·e — Festival Déclic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1a1a2e;
        }

        /* --- Mobile / iOS : page sobre + bouton (pas d'iframe, donc pas de crash) --- */
        #intro {
            display: none;
            min-height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
            gap: 1.5rem;
        }

        #intro h1 { font-size: clamp(1.6rem, 7vw, 2.2rem); }

        #intro p { font-size: 1.05rem; color: #555; max-width: 32ch; }

        .btn {
            display: inline-block;
            padding: 0.95rem 2.2rem;
            background: #5ECBA1;
            color: #07130d;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 50px;
        }

        /* --- Ordinateur : embed plein écran --- */
        #frame-wrap {
            display: none;
            position: fixed;
            inset: 0;
            padding: 12px;
        }

        #frame-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <main id="intro">
        <h1>Devenir intervenant·e</h1>
        <p>Remplis le formulaire pour proposer une intervention au Festival Déclic.</p>
        <a class="btn" id="form-link" href="https://onestpret.notion.site/37386e57ca1b80899f9fdfb87ce0bed9">Remplir le formulaire</a>
    </main>

    <div id="frame-wrap">
        <iframe id="form-frame" allowfullscreen title="Formulaire intervenant·e — Festival Déclic"></iframe>
    </div>

    <script>
        var FORM_EMBED = "https://onestpret.notion.site/ebd/37386e57ca1b80899f9fdfb87ce0bed9";

        // Safari iOS fait planter l'iframe Notion (page trop lourde) → sur iOS / petit
        // écran on n'insère PAS l'iframe et on propose le formulaire en plein écran.
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isSmall = window.matchMedia("(max-width: 820px)").matches;

        if (isIOS || isSmall) {
            document.getElementById("intro").style.display = "flex";
        } else {
            document.getElementById("form-frame").src = FORM_EMBED;
            document.getElementById("frame-wrap").style.display = "block";
        }
    </script>
</body>
</html>

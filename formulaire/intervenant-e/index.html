<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devenir intervenant·e — Festival Déclic</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-page {
            padding: 7rem 1.5rem 4rem;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .form-page h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: #1a1a2e;
        }

        .form-page .intro {
            font-size: 1.1rem;
            color: #555;
            max-width: 650px;
            margin: 0 auto 2.5rem;
        }

        .form-embed {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e2e2;
        }

        .form-embed iframe {
            display: block;
            width: 100%;
            min-height: 800px;
            border: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="/" style="color:#f5c542;text-decoration:none;">Festival Déclic</a></div>
            <ul>
                <li><a href="/#about">Le Festival</a></li>
                <li><a href="/#programme">Programme</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">
        <h1>Devenir intervenant·e</h1>
        <p class="intro">
            Vous souhaitez animer une conférence, un atelier ou une projection au Festival Déclic ?
            Remplissez le formulaire ci-dessous, nous reviendrons vers vous rapidement.
        </p>

        <div class="form-embed">
            <iframe
                src="https://onestpret.notion.site/ebd//37386e57ca1b80899f9fdfb87ce0bed9"
                width="100%"
                height="800"
                frameborder="0"
                allowfullscreen
                title="Formulaire intervenant·e — Festival Déclic"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Festival Déclic. Tous droits réservés.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Devenir participant·e — Festival Déclic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* position: fixed donne à l'iframe une taille définie et fiable,
           y compris sur Safari iOS où les hauteurs en % posent problème. */
        .frame-wrap {
            position: fixed;
            inset: 0;
            padding: 12px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        .frame-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .fallback {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            min-height: 40px;
            padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: #555;
            background: #fff;
            border-top: 1px solid #eee;
            text-align: center;
        }

        .fallback a {
            color: #0f3460;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="frame-wrap">
        <iframe
            src="https://onestpret.notion.site/ebd/37386e57ca1b80b99df5ee83358352db"
            allowfullscreen
            title="Formulaire participant·e — Festival Déclic"></iframe>
    </div>

    <div class="fallback">
        Le formulaire ne s'affiche pas ?
        <a href="https://onestpret.notion.site/37386e57ca1b80b99df5ee83358352db" target="_blank" rel="noopener">Ouvrir le formulaire</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Partenaires — Festival Déclic</title>
    <meta name="theme-color" content="#3DA9E0">
    <link rel="preload" href="/fonts/Folsom-Black.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/assets/illu-cover.jpg" as="image">
    <style>
        @font-face {
            font-family: 'Folsom';
            src: url('/fonts/Folsom-Black.otf') format('opentype');
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #3DA9E0 url('/assets/illu-cover.jpg') center / cover no-repeat fixed;
            padding: calc(56px + env(safe-area-inset-top)) clamp(10px, 3vw, 24px)
                     calc(24px + env(safe-area-inset-bottom));
        }

        .back {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top));
            left: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #111;
            text-decoration: none;
        }

        .back svg { width: 26px; height: 26px; display: block; }

        .wrap { max-width: 820px; margin: 0 auto; }

        .page-title {
            font-family: 'Folsom', Impact, sans-serif;
            text-transform: uppercase;
            font-size: clamp(2.4rem, 9vw, 4rem);
            line-height: 0.9;
            color: #111;
            margin: 0.2rem 0 0.4rem;
        }

        .subtitle {
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 1.4rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
        }

        .logo {
            background: #fff;
            border-radius: 16px;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .logo:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <a class="back" href="/" aria-label="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>

    <div class="wrap">
        <h1 class="page-title">Partenaires</h1>
        <p class="subtitle">Merci à celles et ceux qui rendent le festival possible.</p>

        <div class="grid">
            <a class="logo" href="https://onestpret.com" target="_blank" rel="noopener" aria-label="On Est Prêt">
                <img src="/assets/partenaires/on-est-pret.png" alt="On Est Prêt" loading="lazy">
            </a>
            <a class="logo" href="https://www.backmarket.fr" target="_blank" rel="noopener" aria-label="Back Market">
                <img src="/assets/partenaires/backmarket.png" alt="Back Market" loading="lazy">
            </a>
            <a class="logo" href="https://www.bjorg.fr" target="_blank" rel="noopener" aria-label="Bjorg">
                <img src="/assets/partenaires/bjorg.png" alt="Bjorg" loading="lazy">
            </a>
            <a class="logo" href="https://domorrow.org" target="_blank" rel="noopener" aria-label="Domorrow">
                <img src="/assets/partenaires/domorrow.svg" alt="Domorrow" loading="lazy">
            </a>
            <a class="logo" href="https://tribee.fr" target="_blank" rel="noopener" aria-label="Tribee">
                <img src="/assets/partenaires/tribee.png" alt="Tribee" loading="lazy">
            </a>
            <a class="logo" href="https://www.lanef.com" target="_blank" rel="noopener" aria-label="La Nef">
                <img src="/assets/partenaires/nef.png" alt="La Nef" loading="lazy">
            </a>
            <a class="logo" href="https://www.bcorporation.fr" target="_blank" rel="noopener" aria-label="B Lab France">
                <img src="/assets/partenaires/b-lab-france.png" alt="B Lab France" loading="lazy">
            </a>
            <a class="logo" href="https://www.actioncontrelafaim.org" target="_blank" rel="noopener" aria-label="Action contre la Faim">
                <img src="/assets/partenaires/action-contre-la-faim.png" alt="Action contre la Faim" loading="lazy">
            </a>
            <a class="logo" href="https://www.secours-catholique.org" target="_blank" rel="noopener" aria-label="Secours Catholique – Caritas France">
                <img src="/assets/partenaires/secours-catholique.png" alt="Secours Catholique – Caritas France" loading="lazy">
            </a>
            <a class="logo" href="https://www.sobio-etic.com" target="_blank" rel="noopener" aria-label="So'Bio étic">
                <img src="/assets/partenaires/sobio-etic.webp" alt="So'Bio étic" loading="lazy">
            </a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Déclic</title>
    <link rel="preload" href="/fonts/Folsom-Black.otf" as="font" type="font/otf" crossorigin>
    <style>
        @font-face {
            font-family: 'Folsom';
            src: url('/fonts/Folsom-Black.otf') format('opentype');
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #000;
            color: #5ECBA1;
            font-family: 'Folsom', Impact, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            min-height: 100vh;
        }

        .title {
            font-size: clamp(48px, 14vw, 160px);
            line-height: 1;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .date {
            margin-top: clamp(1rem, 3vw, 2rem);
            font-size: clamp(18px, 5vw, 42px);
            line-height: 1.2;
            letter-spacing: 0.02em;
        }

        .espace-link {
            position: fixed;
            bottom: 1.25rem;
            right: 1.5rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #5ECBA1;
            opacity: 0.55;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .espace-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1 class="title">Festival Déclic</h1>
    <p class="date">29 juin 2026 – 1 juillet 2026</p>

    <a class="espace-link" href="/espace-perso/">Espace perso</a>
</body>
</html>

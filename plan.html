<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Plan — Festival Déclic</title>
    <meta name="theme-color" content="#3DA9E0">
    <link rel="preload" href="/assets/illu-cover.jpg" as="image">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #3DA9E0 url('/assets/illu-cover.jpg') center / cover no-repeat fixed;
        }

        .back {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top));
            left: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #111;
            text-decoration: none;
        }

        .back svg { width: 26px; height: 26px; display: block; }

        /* --- Embed plein écran : 10px gauche/bas/droite, dégagement en haut pour le chevron --- */
        #frame-wrap {
            display: none;
            position: fixed;
            top: calc(52px + env(safe-area-inset-top));
            right: 10px;
            bottom: 10px;
            left: 10px;
            border-radius: 18px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        #frame-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* --- Mobile / iOS : page sobre + bouton (l'iframe Notion plante sur Safari iOS) --- */
        #intro {
            display: none;
            min-height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: calc(5rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
            gap: 1.5rem;
        }

        #intro h1 {
            font-size: clamp(2rem, 10vw, 3rem);
            text-transform: uppercase;
        }

        .btn {
            display: inline-block;
            padding: 0.95rem 2.2rem;
            background: #F47B97;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <a class="back" href="/" aria-label="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>

    <main id="intro">
        <h1>Plan</h1>
        <a class="btn" href="https://onestpret.notion.site/38786e57ca1b80c58a41f147bb11dd78">Ouvrir Plan</a>
    </main>

    <div id="frame-wrap">
        <iframe id="content-frame" allowfullscreen title="Plan — Festival Déclic"></iframe>
    </div>

    <script>
        var EMBED = "https://onestpret.notion.site/ebd/38786e57ca1b80c58a41f147bb11dd78";

        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isSmall = window.matchMedia("(max-width: 820px)").matches;

        if (isIOS || isSmall) {
            document.getElementById("intro").style.display = "flex";
        } else {
            document.getElementById("content-frame").src = EMBED;
            document.getElementById("frame-wrap").style.display = "block";
        }
    </script>
</body>
</html>

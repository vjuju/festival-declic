<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Plan — Festival Déclic</title>
    <meta name="theme-color" content="#3DA9E0">
    <link rel="preload" href="/fonts/Folsom-Black.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/assets/illu-cover.jpg" as="image">
    <style>
        @font-face {
            font-family: 'Folsom';
            src: url('/fonts/Folsom-Black.otf') format('opentype');
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #3DA9E0 url('/assets/illu-cover.jpg') center / cover no-repeat fixed;
            padding: calc(56px + env(safe-area-inset-top)) clamp(10px, 3vw, 24px)
                     calc(24px + env(safe-area-inset-bottom));
        }

        .back {
            position: fixed;
            top: calc(8px + env(safe-area-inset-top));
            left: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #111;
            text-decoration: none;
        }

        .back svg { width: 26px; height: 26px; display: block; }

        .wrap { max-width: 760px; margin: 0 auto; }

        .page-title {
            font-family: 'Folsom', Impact, sans-serif;
            text-transform: uppercase;
            font-size: clamp(2.4rem, 9vw, 4rem);
            line-height: 0.9;
            color: #111;
            margin: 0.2rem 0 1.4rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.3rem;
        }

        .tab {
            font-family: 'Folsom', Impact, sans-serif;
            text-transform: uppercase;
            font-size: clamp(1rem, 4.2vw, 1.5rem);
            line-height: 1;
            padding: 0.4em 0.85em;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            color: #111;
            transition: background 0.2s, transform 0.1s;
        }

        .tab:hover { background: rgba(255, 255, 255, 0.92); }
        .tab.active { background: #F47B97; color: #111; }
        .tab:active { transform: scale(0.97); }

        .panel { display: none; }
        .panel.active { display: block; }

        .plan {
            display: block;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .plan img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .hint {
            margin-top: 0.6rem;
            text-align: center;
            font-size: 0.85rem;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <a class="back" href="/" aria-label="Retour à l'accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>

    <div class="wrap">
        <h1 class="page-title">Plan</h1>

        <div class="tabs" role="tablist" aria-label="Plans du festival">
            <button class="tab active" role="tab" type="button" data-plan="festival" aria-selected="true">Plan festival</button>
            <button class="tab" role="tab" type="button" data-plan="couchage" aria-selected="false">Plan couchage</button>
        </div>

        <section class="panel active" role="tabpanel" data-plan="festival" aria-label="Plan du festival">
            <a class="plan" href="/assets/plan_festival.jpeg" target="_blank" rel="noopener">
                <img src="/assets/plan_festival.jpeg" alt="Plan du festival" width="1131" height="1600">
            </a>
            <p class="hint">Touchez le plan pour l'agrandir</p>
        </section>

        <section class="panel" role="tabpanel" data-plan="couchage" aria-label="Plan des couchages">
            <a class="plan" href="/assets/plan_couchage.jpeg" target="_blank" rel="noopener">
                <img src="/assets/plan_couchage.jpeg" alt="Plan des couchages" width="1131" height="1600" loading="lazy">
            </a>
            <p class="hint">Touchez le plan pour l'agrandir</p>
        </section>
    </div>

    <script>
        (function () {
            var tabs = [].slice.call(document.querySelectorAll(".tab"));
            var panels = [].slice.call(document.querySelectorAll(".panel"));

            function activate(plan) {
                tabs.forEach(function (t) {
                    var on = t.dataset.plan === plan;
                    t.classList.toggle("active", on);
                    t.setAttribute("aria-selected", on ? "true" : "false");
                });
                panels.forEach(function (p) {
                    p.classList.toggle("active", p.dataset.plan === plan);
                });
            }

            tabs.forEach(function (t) {
                t.addEventListener("click", function () { activate(t.dataset.plan); });
            });
        })();
    </script>
</body>
</html>
